<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #1a1e24; font-family: 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="nucleoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="relayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bmeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="soilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- TITRE -->
  <text x="600" y="45" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle">Schéma de Câblage Matériel : STM32 Nucleo-F401RE (Projet Edge AI)</text>
  <text x="600" y="75" fill="#94a3b8" font-size="14" text-anchor="middle">Capteur Capacitif v1.2 | BME280 (I2C) | Module Relais 5V &amp; Pompe 5V avec Diode 1N4007</text>

  <!-- ==================== CARTE STM32 NUCLEO-F401RE ==================== -->
  <g id="nucleo" filter="url(#shadow)" transform="translate(100, 110)">
    <!-- Carte PCB blanche -->
    <rect x="0" y="0" width="360" height="650" rx="16" fill="url(#nucleoBg)" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Zone ST-Link (Haut) -->
    <rect x="15" y="15" width="330" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4,4"/>
    <rect x="145" y="10" width="70" height="35" rx="4" fill="#64748b"/>
    <text x="180" y="32" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">USB ST-LINK</text>
    <circle cx="50" cy="50" r="6" fill="#ef4444"/> <!-- LD1 -->
    <text x="65" y="54" fill="#475569" font-size="11">LD1 (COM)</text>
    <circle cx="50" cy="80" r="6" fill="#22c55e"/> <!-- LD3 -->
    <text x="65" y="84" fill="#475569" font-size="11">LD3 (PWR)</text>
    <text x="240" y="70" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">ST-LINK / V2-1</text>

    <!-- Puce STM32F401RE (Centre) -->
    <rect x="135" y="270" width="90" height="90" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="150" cy="285" r="4" fill="#94a3b8"/>
    <text x="180" y="315" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">STM32F401RE</text>
    <text x="180" y="330" fill="#94a3b8" font-size="9" text-anchor="middle">84MHz Cortex-M4</text>
    <text x="180" y="345" fill="#94a3b8" font-size="9" text-anchor="middle">512K Flash/96K RAM</text>

    <!-- Boutons User & Reset -->
    <rect x="30" y="580" width="35" height="35" rx="6" fill="#2563eb"/>
    <text x="47" y="630" fill="#475569" font-size="10" text-anchor="middle">B1 (USER)</text>
    <rect x="295" y="580" width="35" height="35" rx="6" fill="#000000"/>
    <text x="312" y="630" fill="#475569" font-size="10" text-anchor="middle">B2 (RESET)</text>

    <!-- ================= CONNECTEURS ARDUINO NUCLEO ================= -->
    <!-- Connecteur CN8 (Gauche Bas : Power & Analog) -->
    <rect x="15" y="200" width="40" height="260" rx="4" fill="#0f172a"/>
    <text x="35" y="190" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">POWER / ANALOG</text>

    <!-- Broches Power CN6 / CN8 -->
    <!-- 3V3 (y: 235) -->
    <circle id="pin-3v3" cx="35" cy="235" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="65" y="240" fill="#1e293b" font-size="11" font-weight="bold">3V3</text>

    <!-- 5V (y: 265) -->
    <circle id="pin-5v" cx="35" cy="265" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <text x="65" y="270" fill="#1e293b" font-size="11" font-weight="bold">5V</text>

    <!-- GND (y: 295) -->
    <circle id="pin-gnd1" cx="35" cy="295" r="7" fill="#000000" stroke="#ffffff" stroke-width="2"/>
    <text x="65" y="300" fill="#1e293b" font-size="11" font-weight="bold">GND</text>

    <!-- A0 / PA0 (y: 355) -->
    <circle id="pin-pa0" cx="35" cy="355" r="7" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
    <text x="65" y="360" fill="#1e293b" font-size="11" font-weight="bold">A0 (PA0 - ADC1)</text>

    <!-- A2 / PA4 (y: 415) -->
    <circle id="pin-pa4" cx="35" cy="415" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
    <text x="65" y="420" fill="#1e293b" font-size="11" font-weight="bold">A2 (PA4 - Relais)</text>

    <!-- Connecteur CN5 / CN9 (Droite : Digital & I2C) -->
    <rect x="305" y="200" width="40" height="260" rx="4" fill="#0f172a"/>
    <text x="325" y="190" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">DIGITAL (I2C)</text>

    <!-- D15 / PB8 SCL (y: 235) -->
    <circle id="pin-pb8" cx="325" cy="235" r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <text x="295" y="240" fill="#1e293b" font-size="11" font-weight="bold" text-anchor="end">D15 / PB8 (SCL)</text>

    <!-- D14 / PB9 SDA (y: 265) -->
    <circle id="pin-pb9" cx="325" cy="265" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="295" y="270" fill="#1e293b" font-size="11" font-weight="bold" text-anchor="end">D14 / PB9 (SDA)</text>

    <!-- GND Droite (y: 295) -->
    <circle id="pin-gnd2" cx="325" cy="295" r="7" fill="#000000" stroke="#ffffff" stroke-width="2"/>
    <text x="295" y="300" fill="#1e293b" font-size="11" font-weight="bold" text-anchor="end">GND</text>
  </g>

  <!-- ==================== COMPOSANT 1 : CAPTEUR HUMIDITE SOL ==================== -->
  <g id="soilSensor" filter="url(#shadow)" transform="translate(780, 100)">
    <!-- Sonde capacitive -->
    <rect x="0" y="0" width="280" height="150" rx="10" fill="url(#soilBg)" stroke="#334155" stroke-width="2"/>
    <rect x="200" y="25" width="140" height="100" rx="6" fill="#1e293b" stroke="#475569"/>
    <path d="M 230 45 L 320 45 M 230 75 L 320 75 M 230 105 L 320 105" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    
    <text x="90" y="35" fill="#f8fafc" font-size="14" font-weight="bold">Capteur Sol v1.2</text>
    <text x="90" y="55" fill="#94a3b8" font-size="11">Capacitif (Anti-corrosion)</text>

    <!-- Broches du capteur -->
    <!-- VCC -->
    <circle cx="30" cy="80" r="6" fill="#ef4444"/>
    <text x="45" y="85" fill="#f8fafc" font-size="12">VCC (3.3V)</text>

    <!-- GND -->
    <circle cx="30" cy="105" r="6" fill="#000000" stroke="#fff" stroke-width="1"/>
    <text x="45" y="110" fill="#f8fafc" font-size="12">GND</text>

    <!-- AOUT -->
    <circle cx="30" cy="130" r="6" fill="#eab308"/>
    <text x="45" y="135" fill="#f8fafc" font-size="12">AOUT (Signal analogique)</text>
  </g>

  <!-- ==================== COMPOSANT 2 : BME280 (I2C) ==================== -->
  <g id="bme280" filter="url(#shadow)" transform="translate(780, 290)">
    <rect x="0" y="0" width="280" height="160" rx="10" fill="url(#bmeBg)" stroke="#4c1d95" stroke-width="2"/>
    <rect x="180" y="45" width="55" height="55" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <circle cx="195" cy="60" r="4" fill="#64748b"/>
    <text x="207" y="80" fill="#0f172a" font-size="9" font-weight="bold">BME</text>

    <text x="80" y="35" fill="#ffffff" font-size="14" font-weight="bold">Capteur BME280</text>
    <text x="80" y="52" fill="#ddd6fe" font-size="11">I2C (Temp, Hum, Pression)</text>

    <!-- Broches BME280 -->
    <!-- VIN -->
    <circle cx="30" cy="70" r="6" fill="#ef4444"/>
    <text x="45" y="75" fill="#ffffff" font-size="12">VIN (3.3V)</text>

    <!-- GND -->
    <circle cx="30" cy="95" r="6" fill="#000000" stroke="#fff" stroke-width="1"/>
    <text x="45" y="100" fill="#ffffff" font-size="12">GND</text>

    <!-- SCL -->
    <circle cx="30" cy="120" r="6" fill="#3b82f6"/>
    <text x="45" y="125" fill="#ffffff" font-size="12">SCL (Horloge I2C)</text>

    <!-- SDA -->
    <circle cx="30" cy="145" r="6" fill="#10b981"/>
    <text x="45" y="150" fill="#ffffff" font-size="12">SDA (Données I2C)</text>
  </g>

  <!-- ==================== COMPOSANT 3 : MODULE RELAIS 5V ==================== -->
  <g id="relay" filter="url(#shadow)" transform="translate(780, 490)">
    <rect x="0" y="0" width="360" height="290" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Boitier cube bleu du relais -->
    <rect x="110" y="40" width="130" height="90" rx="6" fill="url(#relayBg)" stroke="#0284c7"/>
    <text x="175" y="80" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">RELAIS 5V</text>
    <text x="175" y="100" fill="#e0f2fe" font-size="10" text-anchor="middle">SRD-05VDC-SL-C</text>

    <!-- Bornier 3 pins d'entrée (Commande STM32) -->
    <rect x="15" y="50" width="50" height="110" rx="4" fill="#0f172a"/>
    <circle cx="40" cy="75" r="6" fill="#dc2626"/>
    <text x="25" y="60" fill="#f8fafc" font-size="10" font-weight="bold">VCC 5V</text>
    
    <circle cx="40" cy="105" r="6" fill="#000000" stroke="#fff" stroke-width="1"/>
    <text x="25" y="93" fill="#f8fafc" font-size="10" font-weight="bold">GND</text>

    <circle cx="40" cy="135" r="6" fill="#f97316"/>
    <text x="28" y="123" fill="#f8fafc" font-size="10" font-weight="bold">IN</text>

    <!-- Bornier à vis de sortie (Puissance vers Pompe) -->
    <rect x="270" y="45" width="75" height="100" rx="4" fill="#15803d"/>
    <circle cx="305" cy="65" r="7" fill="#facc15" stroke="#000" stroke-width="2"/>
    <text x="260" y="70" fill="#86efac" font-size="11" font-weight="bold" text-anchor="end">NO</text>
    <circle cx="305" cy="95" r="7" fill="#facc15" stroke="#000" stroke-width="2"/>
    <text x="260" y="100" fill="#86efac" font-size="11" font-weight="bold" text-anchor="end">COM</text>
    <circle cx="305" cy="125" r="7" fill="#facc15" stroke="#000" stroke-width="2"/>
    <text x="260" y="130" fill="#86efac" font-size="11" font-weight="bold" text-anchor="end">NC</text>

    <!-- Zone Circuit Pompe & Diode 1N4007 -->
    <rect x="20" y="175" width="320" height="100" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="180" y="195" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle">⚡ ALIMENTATION EXTERNE 5V &amp; POMPE</text>
    
    <!-- Pompe miniature -->
    <rect x="35" y="210" width="80" height="45" rx="6" fill="#475569"/>
    <text x="75" y="237" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Pompe 5V</text>

    <!-- Diode 1N4007 -->
    <rect x="155" y="222" width="40" height="18" rx="3" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="185" y="222" width="6" height="18" fill="#e2e8f0"/> <!-- Anneau argenté cathode -->
    <text x="175" y="215" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">1N4007</text>
    <text x="175" y="255" fill="#94a3b8" font-size="9" text-anchor="middle">(Diode Roue Libre)</text>

    <!-- Alim 5V externe -->
    <rect x="245" y="210" width="80" height="45" rx="6" fill="#b91c1c"/>
    <text x="285" y="237" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Alim Ext 5V</text>
  </g>

  <!-- ==================== FILS DE LIAISON (WIRES) ==================== -->

  <!-- 1. CAPTEUR SOL -> NUCLEO -->
  <!-- VCC (Rouge) : Capteur Sol (810, 180) -> Nucleo 3V3 (135, 345) -->
  <path d="M 810 180 C 650 180, 250 150, 135 345" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- GND (Noir) : Capteur Sol (810, 205) -> Nucleo GND (135, 405) -->
  <path d="M 810 205 C 670 205, 230 200, 135 405" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- AOUT (Jaune) : Capteur Sol (810, 230) -> Nucleo PA0 (135, 465) -->
  <path d="M 810 230 C 600 230, 260 300, 135 465" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>

  <!-- 2. BME280 -> NUCLEO -->
  <!-- VIN (Rouge) -> Pont vers 3V3 -->
  <path d="M 810 360 C 650 360, 200 280, 135 345" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- GND (Noir) -> Nucleo GND Droite (425, 405) -->
  <path d="M 810 385 C 650 385, 550 405, 425 405" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- SCL (Bleu) : BME280 (810, 410) -> Nucleo D15/PB8 (425, 345) -->
  <path d="M 810 410 C 620 410, 520 345, 425 345" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <!-- SDA (Vert) : BME280 (810, 435) -> Nucleo D14/PB9 (425, 375) -->
  <path d="M 810 435 C 620 435, 520 375, 425 375" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- 3. RELAIS -> NUCLEO -->
  <!-- VCC 5V (Rouge foncé) : Relais (820, 565) -> Nucleo 5V (135, 375) -->
  <path d="M 820 565 C 600 565, 250 450, 135 375" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <!-- GND Relais (Noir) -> Nucleo GND (135, 405) -->
  <path d="M 820 595 C 620 595, 300 480, 135 405" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- IN Relais (Orange) : Relais (820, 625) -> Nucleo PA4 (135, 525) -->
  <path d="M 820 625 C 550 625, 280 540, 135 525" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>

  <!-- LÉGENDE COULEURS DES FILS (En bas) -->
  <g id="legend" transform="translate(80, 785)">
    <rect x="0" y="0" width="1040" height="45" rx="8" fill="#0f172a" stroke="#334155"/>
    
    <circle cx="30" cy="22" r="7" fill="#ef4444"/>
    <text x="45" y="26" fill="#cbd5e1" font-size="12">Rouge : 3.3V</text>

    <circle cx="160" cy="22" r="7" fill="#dc2626"/>
    <text x="175" y="26" fill="#cbd5e1" font-size="12">Rouge Foncé : 5V</text>

    <circle cx="320" cy="22" r="7" fill="#000000" stroke="#fff" stroke-width="1"/>
    <text x="335" y="26" fill="#cbd5e1" font-size="12">Noir : Masse (GND)</text>

    <circle cx="490" cy="22" r="7" fill="#eab308"/>
    <text x="505" y="26" fill="#cbd5e1" font-size="12">Jaune : Analogique (PA0)</text>

    <circle cx="680" cy="22" r="7" fill="#3b82f6"/>
    <text x="695" y="26" fill="#cbd5e1" font-size="12">Bleu : SCL (PB8)</text>

    <circle cx="810" cy="22" r="7" fill="#10b981"/>
    <text x="825" y="26" fill="#cbd5e1" font-size="12">Vert : SDA (PB9)</text>

    <circle cx="940" cy="22" r="7" fill="#f97316"/>
    <text x="955" y="26" fill="#cbd5e1" font-size="12">Orange : IN (PA4)</text>
  </g>
</svg>
